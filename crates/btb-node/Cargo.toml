[package]
name = "btb-node"
description = "BTB Chain validator node: libp2p/QUIC networking, consensus driver, executor and JSON-RPC"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "btb-node"
path = "src/main.rs"

[dependencies]
btb-consensus = { path = "../btb-consensus" }
btb-chain = { path = "../btb-chain" }
btb-runtime = { path = "../btb-runtime" }
btb-codec = { path = "../btb-codec" }
btb-oracle = { path = "../btb-oracle" }
btb-vm = { path = "../btb-vm" }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
sha2 = "0.11.1"
# MIT. QUIC only (TLS 1.3 inside QUIC authenticates the peer id, so no noise/yamux), request-response for
# point-to-point messages, ed25519 identities derived from the consensus key.
libp2p = { version = "0.57", default-features = false, features = ["tokio", "quic", "request-response", "ed25519"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal"] }
futures = "0.3"
serde_json = "1"
rand = "0.8"
# Apache-2.0 OR MIT. Optional at-rest encryption of the DKG share files.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

# MIT OR Apache-2.0. Blocking HTTP client for HTTPS actions (feature `https`); rustls with the ring
# provider, webpki-roots (CDLA-Permissive-2.0) for the trust anchors, no OpenSSL.
ureq = { version = "2.12", default-features = false, features = ["tls"], optional = true }

[dev-dependencies]
tempfile = "3"
btb-vm = { path = "../btb-vm" }

[features]
# `https`: validators can fetch HTTPS actions (docs/ORACLES.md). Without it they answer every
# action request with an agreed-upon failure ("fetch failed") and the chain still works.
default = ["https"]
https = ["dep:ureq"]
# Keep chain state in RocksDB (--data <dir>) instead of memory. Needs clang/libclang to build.
rocksdb = ["btb-runtime/rocksdb"]
