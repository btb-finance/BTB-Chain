[package]
name = "{{name}}"
description = "A BTB contract"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: this crate only builds for riscv64imac-unknown-none-elf (see .cargo/config.toml).
[workspace]

[dependencies]
{{sdk}}

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1
debug = false

[profile.dev]
panic = "abort"
