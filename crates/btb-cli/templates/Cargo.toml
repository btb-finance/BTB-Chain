[package]
name = "{{name}}"
description = "A BTB contract"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: this crate only builds for riscv64imac-unknown-none-elf (see .cargo/config.toml).
[workspace]

[dependencies]
{{sdk}}

# Host-side index declarations read by `btb dev` (Table:index:kind@offset, see docs/DEV_SERVER.md).
[package.metadata.btb]
indexes = ["Note:owner:addr@0"]
fields = ["Note:addr,bool,string"]

[profile.release]
opt-level = "s"
panic = "abort"
lto = true
codegen-units = 1
debug = false

[profile.dev]
panic = "abort"
