[package]
name = "btb-chain"
description = "Deterministic execution layer for BTB Chain: transactions, genesis, blocks, fees, crons and a mempool"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
btb-codec = { path = "../btb-codec" }
btb-vm = { path = "../btb-vm" }
btb-runtime = { path = "../btb-runtime" }
btb-consensus = { path = "../btb-consensus" }
# BSD-3-Clause. Same feature set as btb-consensus so the lockfile stays shared.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
sha2 = "0.11.1"

[features]
default = []
# Also run the RocksDB determinism test (needs clang/libclang).
rocksdb = ["btb-runtime/rocksdb"]

