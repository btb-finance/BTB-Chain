[package]
name = "btb-lsp"
description = "Language server with BTB-specific diagnostics, hover and completion for contract sources"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
name = "btb_lsp"
path = "src/lib.rs"

[[bin]]
name = "btb-lsp"
path = "src/main.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
serde_json = "1"
quote = "1"
