[package]
name = "btb-tests"
description = "End-to-end tests: example contracts compiled to RISC-V and run in btb-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
btb-vm = { path = "../btb-vm" }
btb-codec = { path = "../btb-codec" }
btb-sdk = { path = "../btb-sdk" }
btb-runtime = { path = "../btb-runtime" }
btb-dev = { path = "../btb-dev" }

[features]
default = []
# Also run the RocksDB-backed end-to-end tests (needs clang/libclang).
rocksdb = ["btb-runtime/rocksdb", "btb-dev/rocksdb"]
