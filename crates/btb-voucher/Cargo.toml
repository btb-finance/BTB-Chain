[package]
name = "btb-voucher"
description = "Signed payment-channel vouchers for BTB Chain: create, verify and account for per-request fees off-chain"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# BSD-3-Clause. No std, no allocation: usable from wallets, hosts and the chain itself.
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
sha2 = { version = "0.11.1", default-features = false }
